name: Merge to Main

on:
  push:
    branches:
      - main

env:
  REGION: us-central1
  APP_NAME: ripper
  BUCKET_NAME: ${{ secrets.CDN_BUCKET_NAME }}
  TYPE: apps

jobs:
  build-and-upload-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
      pull-requests: "write"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Calculate short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Upload frontend bundle to GCS commit ref
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          process_gcloudignore: false
          path: dist
          destination: ${{ env.BUCKET_NAME }}/${{ env.TYPE }}/${{ env.APP_NAME }}/${{ steps.vars.outputs.short_sha }}
          parent: false

      - name: Upload frontend bundle to GCS latest
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          process_gcloudignore: false
          path: dist
          destination: ${{ env.BUCKET_NAME }}/${{ env.TYPE }}/${{ env.APP_NAME }}/latest
          parent: false

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Invalidate Cloud CDN
        run: |
          gcloud compute url-maps invalidate-cdn-cache "${{ secrets.CDN_URL_MAP }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --path="/${{ env.TYPE }}/${{ env.APP_NAME }}/latest/*" \
            --async

      - name: Output CDN Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDN_HOST: ${{ vars.CDN_HOST || 'https://cdn.lkr.dev' }}
        run: |
          SHORT="${{ steps.vars.outputs.short_sha }}"
          SHA_LINKS=""
          LATEST_LINKS=""
          for f in dist/*.js; do
            file="${f#dist/}"
            SHA_LINKS+="- ${CDN_HOST}/${{ env.TYPE }}/${{ env.APP_NAME }}/${SHORT}/${file}"$'\n'
            LATEST_LINKS+="- ${CDN_HOST}/${{ env.TYPE }}/${{ env.APP_NAME }}/latest/${file}"$'\n'
          done

          BODY="### 🚀 CDN Deployment Links"$'\n\n'"**Commit (${SHORT}):**"$'\n'"${SHA_LINKS}"$'\n'"**Latest:**"$'\n'"${LATEST_LINKS}"

          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/comments" -f body="$BODY"
          PR=$(gh pr list --repo "${{ github.repository }}" --state merged --search "$GITHUB_SHA" --json number -q '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          fi
