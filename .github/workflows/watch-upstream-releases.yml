name: Watch Upstream Releases

on:
  schedule:
    # Runs every Monday and Thursday at 09:30 UTC
    - cron: "30 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-upstream-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Check upstream looker-cli & looker-skills parity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-upstream-releases.mjs
