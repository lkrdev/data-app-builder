<body>

<preview-host></preview-host>

<script type="module">
  import './preview-host.js';

  // Install local dev server queryRunner for standalone preview environment
  window.DataApps = window.DataApps || {};
  window.DataApps.queryRunner = async (rawQuery, signal) => {
    const query = {
      ...rawQuery,
      view: rawQuery.view || rawQuery.explore,
    };
    const r = await fetch('/api/query', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Looker-Preview-Client': '1',
      },
      body: JSON.stringify(query),
      signal,
    });
    if (!r.ok) {
      let body = {};
      try { body = await r.json(); } catch {}
      const rawText = body.message || body.detail || body.error || r.statusText || 'Query failed';
      const err = new Error(rawText);
      err.status = r.status;
      err.error_type = body.error_type || (r.status === 400 ? 'model_or_field_not_found' : 'looker_error');
      err.hint = body.hint || (rawText.toLowerCase().includes('model not found')
        ? `Model "${query.model}" is not deployed in your Looker instance. Check data-apps-config.json or use a model available on your server.`
        : 'Check your explore and field names in the LookML model.');
      err.suggested_action = body.suggested_action || 'Verify Looker model permissions or switch to demo data.';
      err.raw = body;
      throw err;
    }
    return r.json();
  };
</script>
</body>
</html>
