<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Apps Gallery</title>
<link rel="icon" type="image/svg+xml" href="/preview-server/favicon.svg">
<script type="importmap">{"imports": {"/runtime/": "/runtime/", "/vendor/": "https://www.gstatic.com/looker-data-apps/vendor/"}}</script>
</head>
<body>

<preview-host></preview-host>

<script type="module">
  // Install local dev server queryRunner for standalone preview environment
  window.DataApps = window.DataApps || {};
  window.DataApps.queryRunner = async (rawQuery, signal) => {
    const query = {
      ...rawQuery,
      view: rawQuery.view || rawQuery.explore,
    };
    const r = await fetch('/api/query', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Looker-Preview-Client': '1',
      },
      body: JSON.stringify(query),
      signal,
    });
    if (!r.ok) {
      let body = {};
      try { body = await r.json(); } catch {}
      const rawText = body.message || body.detail || body.error || r.statusText || 'Query failed';
      const err = new Error(rawText);
      err.status = r.status;
      err.error_type = body.error_type || (r.status === 400 ? 'model_or_field_not_found' : 'looker_error');
      err.hint = body.hint || (rawText.toLowerCase().includes('model not found')
        ? `Model "${query.model}" is not deployed in your Looker instance. Check data-apps-config.json or use a model available on your server.`
        : 'Check your explore and field names in the LookML model.');
      err.suggested_action = body.suggested_action || 'Verify Looker model permissions or switch to demo data.';
      err.raw = body;
      throw err;
    }
    return r.json();
  };

  import('/preview-server/preview-host.js').catch((err) => {
    console.error('Failed to load preview host:', err);
    const rawMsg = (err && (err.stack || err.message)) ? String(err.stack || err.message) : String(err);
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const hostEl = document.querySelector('preview-host') || document.body;
    const card = document.createElement('div');
    card.className = 'preview-load-error';
    card.style.cssText = 'max-width:720px;margin:48px auto;padding:24px;border:1px solid #fecaca;border-radius:12px;background:#fef2f2;color:#991b1b;font-family:system-ui,sans-serif;';
    card.innerHTML = '<h3>Error Loading Preview</h3>'
      + '<p>Failed to load preview host libraries from the assets host. Check your internet connection.</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;">' + esc(rawMsg) + '</pre>';
    hostEl.appendChild(card);
    let diag = document.getElementById('preview-diagnostics');
    if (!diag) {
      diag = document.createElement('div');
      diag.id = 'preview-diagnostics';
      diag.style.display = 'none';
      document.body.appendChild(diag);
    }
    diag.setAttribute('data-error-count', '1');
    diag.textContent = JSON.stringify([{ id: 1, kind: 'Preview Bootstrap Error', message: rawMsg }]);
  });
</script>
</body>
</html>
